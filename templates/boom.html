<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boom - Lolo y Rous</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #d4af37 0%, #8b0000 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: inline-block;
            transition: background 0.3s;
        }

        .header a:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #d4af37;
        }

        .stat-box.danger .stat-value {
            color: #ff4545;
        }

        .game-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .question-box {
            text-align: center;
            margin-bottom: 40px;
        }

        .question-box h2 {
            color: #8b0000;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.3em;
            color: #333;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .bomb {
            position: relative;
            aspect-ratio: 1;
            cursor: pointer;
            perspective: 1000px;
        }

        .bomb-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .bomb.flipped .bomb-inner {
            transform: rotateY(180deg);
        }

        .bomb-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2em;
            transition: all 0.3s;
        }

        .bomb-front {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: 3px solid #cc4444;
        }

        .bomb-front:hover {
            transform: scale(1.05);
        }

        .bomb-back {
            background: linear-gradient(135deg, #ffd93d 0%, #ffb700 100%);
            color: #333;
            border: 3px solid #ffb700;
            transform: rotateY(180deg);
            padding: 15px;
            text-align: center;
            word-wrap: break-word;
            font-size: 0.9em;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bomb-back span {
            display: block;
            transform: rotateY(180deg);
        }

        .bomb.correct .bomb-back {
            background: linear-gradient(135deg, #22a022 0%, #1a7a1a 100%);
            border-color: #22a022;
            color: white;
        }

        .bomb.incorrect .bomb-back {
            background: linear-gradient(135deg, #ff4545 0%, #cc3333 100%);
            border-color: #ff4545;
            color: white;
        }

        .bomb-emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .bomb.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .money {
            font-size: 1.3em;
            font-weight: bold;
            color: #22a022;
        }

        .corrects {
            font-size: 1.1em;
            color: #8b0000;
        }

        .game-over-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-screen.active {
            display: flex;
        }

        .game-over-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
        }

        .game-over-box h2 {
            color: #8b0000;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .game-over-box p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        .final-money {
            font-size: 2em;
            font-weight: bold;
            color: #22a022;
            margin: 20px 0;
        }

        .highscore-display {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .highscore-text {
            color: #333;
            font-weight: bold;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-next {
            background: #d4af37;
            color: #8b0000;
            display: block;
            margin: 20px auto 0;
        }

        .btn-next:hover {
            background: #c99c27;
            transform: scale(1.05);
        }

        .btn-restart {
            background: #8b0000;
            color: white;
            display: block;
            margin: 10px auto;
        }

        .btn-restart:hover {
            background: #660000;
        }

        @media (max-width: 768px) {
            .options-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .game-container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💣 Boom 💣</h1>
            <a href="/">← Volver</a>
        </div>

        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-label">Dinero</div>
                <div class="stat-value" id="money">$0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Correctas</div>
                <div class="stat-value" id="correct">0/5</div>
            </div>
            <div class="stat-box danger">
                <div class="stat-label">HighScore</div>
                <div class="stat-value" id="highscore">$0</div>
            </div>
        </div>

        <div class="game-container">
            <div class="info-bar">
                <div class="corrects">Bombas cortadas: <span id="corrects-cut">0</span>/4</div>
                <div class="money">Dinero acumulado: <span id="current-money">$0</span></div>
            </div>

            <div class="question-box">
                <h2>Evita seleccionar la respuesta incorrecta</h2>
                <div class="question-text" id="question-text">Cargando pregunta...</div>
            </div>

            <div class="options-container" id="options-container"></div>

            <button class="btn btn-next" onclick="nextQuestion()" id="next-btn" style="display: none;">Siguiente pregunta →</button>
        </div>
    </div>

    <div class="game-over-screen" id="game-over-screen">
        <div class="game-over-box">
            <h2 id="game-over-title">¡BOOM! 💥</h2>
            <p id="game-over-message"></p>
            <div class="final-money">Dinero perdido: <span id="lost-money">$0</span></div>
            <div class="highscore-display">
                <div class="highscore-text">Tu HighScore: <span id="final-highscore">$0</span></div>
            </div>
            <button class="btn btn-restart" onclick="location.reload()">Jugar de nuevo</button>
            <a href="/" style="text-decoration: none;"><button class="btn btn-next">Volver al inicio</button></a>
        </div>
    </div>

    <script>
        let currentQuestion = null;
        let currentMoney = 0;
        let correctsCut = 0;
        let highScore = localStorage.getItem('boomHighScore') ? parseInt(localStorage.getItem('boomHighScore')) : 0;
        let gameActive = true;

        const MONEY_PER_CORRECT = 100;

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('highscore').textContent = '$' + highScore;
            loadQuestion();
        });

        async function loadQuestion() {
            if (!gameActive) return;

            try {
                const response = await fetch('/api/boom');
                const data = await response.json();
                currentQuestion = data;
                correctsCut = 0;

                renderQuestion();
                updateDisplay();
            } catch (error) {
                console.error('Error cargando pregunta:', error);
            }
        }

        function renderQuestion() {
            document.getElementById('question-text').textContent = currentQuestion.question;
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            currentQuestion.options.forEach((option, index) => {
                const bomb = document.createElement('div');
                bomb.className = 'bomb';
                bomb.dataset.option = option;
                bomb.dataset.index = index;

                const isIncorrect = option === currentQuestion.incorrect_option;
                const correctClass = isIncorrect ? 'incorrect' : 'correct';

                bomb.innerHTML = `
                    <div class="bomb-inner">
                        <div class="bomb-front">
                            <div class="bomb-emoji">💣</div>
                        </div>
                        <div class="bomb-back ${correctClass}">
                            <span>${option}</span>
                        </div>
                    </div>
                `;

                bomb.onclick = () => selectBomb(bomb, isIncorrect);
                optionsContainer.appendChild(bomb);
            });
        }

        function selectBomb(bombElement, isIncorrect) {
            if (!gameActive || bombElement.classList.contains('flipped') || bombElement.classList.contains('disabled')) {
                return;
            }

            bombElement.classList.add('flipped');

            if (isIncorrect) {
                // ¡BOOM! Opción incorrecta seleccionada
                gameActive = false;
                showGameOver();
            } else {
                // Opción correcta
                correctsCut++;
                currentMoney += MONEY_PER_CORRECT;
                updateDisplay();

                // Desactivar la bomba
                bombElement.classList.add('disabled');

                // Verificar si ganó
                if (correctsCut === 4) {
                    gameActive = false;
                    setTimeout(() => {
                        document.getElementById('next-btn').style.display = 'block';
                    }, 500);
                }
            }
        }

        function updateDisplay() {
            document.getElementById('current-money').textContent = '$' + currentMoney;
            document.getElementById('corrects-cut').textContent = correctsCut;
            document.getElementById('correct').textContent = correctsCut + '/4';
            document.getElementById('money').textContent = '$' + currentMoney;
        }

        function showGameOver() {
            const screen = document.getElementById('game-over-screen');
            const title = document.getElementById('game-over-title');
            const message = document.getElementById('game-over-message');
            const lostMoney = document.getElementById('lost-money');

            title.textContent = '¡BOOM! 💥';
            message.textContent = 'Cortaste la bomba equivocada';
            lostMoney.textContent = '$' + currentMoney;

            if (currentMoney > highScore) {
                highScore = currentMoney;
                localStorage.setItem('boomHighScore', highScore);
            }

            document.getElementById('final-highscore').textContent = '$' + highScore;
            document.getElementById('highscore').textContent = '$' + highScore;

            screen.classList.add('active');
        }

        function nextQuestion() {
            document.getElementById('next-btn').style.display = 'none';
            gameActive = true;
            loadQuestion();
        }
    </script>

    {% include 'music-player.html' %}
</body>
</html>
