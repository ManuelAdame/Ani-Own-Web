<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .trivia-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .question-counter {
            text-align: center;
            color: #667eea;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .image-container {
            width: 100%;
            height: 400px;
            background: #f0f0f0;
            border-radius: 15px;
            margin-bottom: 30px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.5s ease;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .image-placeholder {
            color: #999;
            font-size: 1.2em;
            text-align: center;
            padding: 20px;
        }

        .question-text {
            font-size: 1.5em;
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            padding: 20px;
            background: #f8f9fa;
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
            color: #333;
        }

        .option-btn:hover:not(.disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .option-btn.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option-btn.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .feedback {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 20px;
            min-height: 30px;
        }

        .feedback.correct {
            color: #4caf50;
            font-weight: bold;
        }

        .feedback.incorrect {
            color: #f44336;
            font-weight: bold;
        }

        .next-btn {
            display: none;
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .next-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .next-btn.show {
            display: block;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid white;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        .completion-message {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .completion-message.show {
            display: block;
        }

        .completion-message h2 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .completion-message p {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 30px;
        }

        .score {
            font-size: 3em;
            color: #4caf50;
            font-weight: bold;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .trivia-card {
                padding: 25px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .image-container {
                height: 300px;
            }

            .header h1 {
                font-size: 2em;
            }

            .question-text {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💭 Trivia 2025</h1>
            <p>¿Recuerdas estos momentos especiales?</p>
        </div>

        <div class="trivia-card" id="triviaCard">
            <div class="question-counter" id="questionCounter">Pregunta 1 de X</div>
            
            <div class="image-container" id="imageContainer">
                <div class="image-placeholder">Cargando imagen...</div>
            </div>

            <div class="question-text" id="questionText">Cargando pregunta...</div>

            <div class="feedback" id="feedback"></div>

            <div class="options" id="optionsContainer"></div>

            <button class="next-btn" id="nextBtn">Siguiente Pregunta →</button>
        </div>

        <div class="trivia-card completion-message" id="completionMessage">
            <h2>🎉 ¡Felicidades!</h2>
            <p>Has completado todas las preguntas de esta trivia</p>
            <div class="score" id="finalScore"></div>
            <a href="/" class="back-btn">← Volver al inicio</a>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/" class="back-btn">← Volver</a>
        </div>
    </div>

    <script>
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // Cargar preguntas al iniciar
        async function loadQuestions() {
            try {
                const response = await fetch('/api/trivia-2025');
                const data = await response.json();
                questions = data.questions;
                showQuestion();
            } catch (error) {
                console.error('Error al cargar preguntas:', error);
                document.getElementById('questionText').textContent = 'Error al cargar las preguntas';
            }
        }

        // Mostrar pregunta actual
        function showQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showCompletion();
                return;
            }

            answered = false;
            const question = questions[currentQuestionIndex];
            
            // Actualizar contador
            document.getElementById('questionCounter').textContent = 
                `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;
            
            // Actualizar imagen
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.innerHTML = `<img src="${question.image}" alt="Imagen de la pregunta" onerror="this.parentElement.innerHTML='<div class=\\'image-placeholder\\'>Imagen próximamente...</div>'">`;
            
            // Actualizar pregunta
            document.getElementById('questionText').textContent = question.question;
            
            // Limpiar feedback
            const feedback = document.getElementById('feedback');
            feedback.textContent = '';
            feedback.className = 'feedback';
            
            // Crear opciones
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });
            
            // Ocultar botón siguiente
            document.getElementById('nextBtn').classList.remove('show');
        }

        // Verificar respuesta
        function checkAnswer(selectedIndex) {
            if (answered) return;
            
            answered = true;
            const question = questions[currentQuestionIndex];
            const options = document.querySelectorAll('.option-btn');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            const imageContainer = document.getElementById('imageContainer');
            
            // Deshabilitar todas las opciones
            options.forEach(btn => btn.classList.add('disabled'));
            
            // Cambiar la imagen a la imagen de respuesta si existe
            if (question.answer_image) {
                imageContainer.innerHTML = `<img src="${question.answer_image}" alt="Respuesta revelada" onerror="this.parentElement.innerHTML='<div class=\\'image-placeholder\\'>Imagen de respuesta próximamente...</div>'">`;
            }
            
            // Marcar respuesta correcta e incorrecta
            if (selectedIndex === question.correct_answer) {
                options[selectedIndex].classList.add('correct');
                feedback.textContent = '¡Correcto! 🎉';
                feedback.className = 'feedback correct';
                score++;
            } else {
                options[selectedIndex].classList.add('incorrect');
                options[question.correct_answer].classList.add('correct');
                feedback.textContent = '¡Ups! La respuesta correcta era otra 😊';
                feedback.className = 'feedback incorrect';
            }
            
            // Mostrar botón siguiente
            nextBtn.classList.add('show');
        }

        // Siguiente pregunta
        document.getElementById('nextBtn').addEventListener('click', () => {
            currentQuestionIndex++;
            showQuestion();
        });

        // Mostrar mensaje de finalización
        function showCompletion() {
            document.getElementById('triviaCard').style.display = 'none';
            const completionMessage = document.getElementById('completionMessage');
            completionMessage.classList.add('show');
            document.getElementById('finalScore').textContent = 
                `${score} de ${questions.length} correctas`;
        }

        // Iniciar
        loadQuestions();
    </script>
</body>
</html>
